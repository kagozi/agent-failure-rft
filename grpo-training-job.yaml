# GRPO / rule-based RFT training job for Paper 2 -- trains a LoRA adapter
# on top of Qwen3-VL-8B-Instruct against the click-in-bbox grounding reward.
#
# Framework: TRL's GRPOTrainer (confirmed 2026-11-03 to have native VLM
# support -- see train_grpo_grounding.py's module docstring for why TRL was
# chosen over verl/OpenRLHF). Not a custom image: pip-installs trl/peft/
# accelerate onto an official PyTorch+CUDA base image at container start,
# matching the pattern already used in jobs/failure-taxonomy-job.yaml
# (avoids a registry build+push for a script this size).
#
# Data: 278 curated (screenshot, instruction, correct_action) examples from
# Paper 1's GROUNDING_FAILURE episodes -- see prepare_grpo_dataset.py and
# taxonomy_full/paper2_training_candidates_final.jsonl for how this pool
# was built. train_grpo_grounding.py expects the *already-prepared*
# grpo_dataset/{train,eval} HF-Dataset-on-disk directories, not the raw
# JSONL -- run prepare_grpo_dataset.py locally first, then upload:
#
#   python prepare_grpo_dataset.py --out grpo_dataset/
#   kubectl create configmap grpo-training-scripts -n gnimpieba-dts-lab \
#     --from-file=train_grpo_grounding.py=train_grpo_grounding.py \
#     --from-file=grpo_rewards.py=grpo_rewards.py \
#     --from-file=prepare_grpo_dataset.py=prepare_grpo_dataset.py
#   kubectl apply -f grpo-pvc.yaml   # one-time, if not already created
#   # then copy grpo_dataset/ onto grpo-dataset-pvc (e.g. via a throwaway
#   # busybox pod + kubectl cp, same pattern used throughout this project
#   # to pull data OFF the PVC -- just reversed)
#   kubectl apply -f grpo-training-job.yaml
#
# GPU request: 1 GPU, constrained to >30GB via nodeAffinity below -- this is
# deliberately NOT the 4x-A100 ask in the original placeholder version of
# this file, which would be a wasteful, slower-to-schedule request on
# shared infra for a 278-example / LoRA-scale job. NRP's GPU node-selector
# labels RESOLVED 2026-11-03 (see affinity block below) by direct
# `kubectl get nodes` inspection, same practice as the KVM question in
# ROADMAP.md Step 0. Still open: whether Qwen3-VL-8B-Instruct needs an HF
# token to download (see comment near volumeMounts below).

apiVersion: batch/v1
kind: Job
metadata:
  name: grpo-rft-paper2
  namespace: gnimpieba-dts-lab
  labels:
    app: grpo-rft-paper2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      # NRP is a federated cluster spanning hardware from many contributing
      # institutions -- confirmed 2026-11-03 via `kubectl get nodes` that the
      # GPU pool ranges from 8GB Quadro M4000s and 11GB GTX 1080 Tis up to
      # 143GB H200s, all schedulable under the same nvidia.com/gpu resource
      # name. Without a constraint, an 8B VLM + LoRA + 8-way GRPO generation
      # (KV-cache for 8 parallel completions, on top of ~16GB just for bf16
      # weights) could land on hardware too small to even load the model.
      # Gt 30000 excludes the 23-24.5GB consumer-tier cards (RTX 3090/4090,
      # A10, L4, A5000) and lands on A6000/A40/L40/L40S/A100/H100/H200-class
      # nodes instead -- dozens of qualifying nodes cluster-wide, not a
      # scheduling bottleneck.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["30000"]
      containers:
        - name: grpo-train
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          command: ["/bin/sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir --quiet
              "transformers>=4.57" "trl>=0.26" peft accelerate pillow datasets &&
              cp /scripts/*.py /workspace/ &&
              cd /workspace &&
              accelerate launch train_grpo_grounding.py
              --dataset_dir /data/grpo_dataset
              --output_dir /checkpoints/grpo-grounding-v1
              --num_train_epochs 3
          # No NRP LLM credentials needed here -- the reward is purely
          # rule-based (click-in-bbox), no judge/LLM calls at training
          # time. No HF_TOKEN needed either -- confirmed 2026-11-03 via
          # the HF API (gated=false, private=false) that
          # Qwen/Qwen3-VL-8B-Instruct downloads without authentication.
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: dataset
              mountPath: /data
            - name: checkpoints
              mountPath: /checkpoints
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: scripts
          configMap:
            name: grpo-training-scripts
        - name: dataset
          persistentVolumeClaim:
            claimName: grpo-dataset-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
