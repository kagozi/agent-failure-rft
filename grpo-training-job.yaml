# GRPO / rule-based RFT training job for Paper 2 -- trains a LoRA adapter
# on top of Qwen3-VL-8B-Instruct against the click-in-bbox grounding reward.
#
# Framework: TRL's GRPOTrainer (confirmed 2026-11-03 to have native VLM
# support -- see train_grpo_grounding.py's module docstring for why TRL was
# chosen over verl/OpenRLHF). Not a custom image: pip-installs trl/peft/
# accelerate onto an official PyTorch+CUDA base image at container start,
# matching the pattern already used in jobs/failure-taxonomy-job.yaml
# (avoids a registry build+push for a script this size).
#
# Data: 278 curated (screenshot, instruction, correct_action) examples from
# Paper 1's GROUNDING_FAILURE episodes -- see prepare_grpo_dataset.py and
# taxonomy_full/paper2_training_candidates_final.jsonl for how this pool
# was built. train_grpo_grounding.py expects the *already-prepared*
# grpo_dataset/{train,eval} HF-Dataset-on-disk directories, not the raw
# JSONL -- run prepare_grpo_dataset.py locally first, then upload:
#
#   python prepare_grpo_dataset.py --out grpo_dataset/
#   kubectl create configmap grpo-training-scripts -n gai-lina-group \
#     --from-file=train_grpo_grounding.py=train_grpo_grounding.py \
#     --from-file=grpo_rewards.py=grpo_rewards.py \
#     --from-file=prepare_grpo_dataset.py=prepare_grpo_dataset.py
#   kubectl apply -f k8s/grpo-dataset-pvc.yaml   # one-time, if not already created
#   # then copy grpo_dataset/ onto that PVC (e.g. via a throwaway busybox
#   # pod + kubectl cp, same pattern used throughout this project to pull
#   # data OFF the PVC -- just reversed)
#   kubectl apply -f grpo-training-job.yaml
#
# GPU request: starts at 1 GPU. An 8B VLM with LoRA (r=16, bf16) fits
# comfortably on a single modern GPU (~20-30GB) -- this is deliberately NOT
# the 4x-A100 ask in the original placeholder version of this file, which
# would be a wasteful, slower-to-schedule request on shared infra for a
# 278-example / LoRA-scale job. NOT YET CONFIRMED: NRP's specific GPU
# node-selector/product labels for this namespace -- check `kubectl
# describe nodes` output or NRP office hours before submitting, same as
# the KVM question was resolved in ROADMAP.md Step 0.

apiVersion: batch/v1
kind: Job
metadata:
  name: grpo-rft-paper2
  namespace: gai-lina-group
  labels:
    app: grpo-rft-paper2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: grpo-train
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          command: ["/bin/sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir --quiet
              "transformers>=4.57" "trl>=0.26" peft accelerate pillow datasets &&
              cp /scripts/*.py /workspace/ &&
              cd /workspace &&
              accelerate launch train_grpo_grounding.py
              --dataset_dir /data/grpo_dataset
              --output_dir /checkpoints/grpo-grounding-v1
              --num_train_epochs 3
          # No NRP LLM credentials needed here -- the reward is purely
          # rule-based (click-in-bbox), no judge/LLM calls at training
          # time. If Qwen3-VL-8B-Instruct turns out to need a HF token
          # (rate limits / gating), add an HF_TOKEN secretRef here --
          # NOT YET CONFIRMED whether this specific repo requires one.
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: dataset
              mountPath: /data
            - name: checkpoints
              mountPath: /checkpoints
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: scripts
          configMap:
            name: grpo-training-scripts
        - name: dataset
          persistentVolumeClaim:
            claimName: grpo-dataset-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
