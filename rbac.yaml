# RBAC for the OSWorld runner Job (osworld-job.yaml) to manage VirtualMachineInstances
# in-cluster via kubevirt_provider. The namespace's default ServiceAccount has no
# permissions for this -- KubeVirtProvider needs create/get/list/watch/delete on
# virtualmachineinstances.kubevirt.io to boot and tear down the desktop VM per episode.
#
# Apply once per namespace:
#   kubectl apply -f rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osworld-runner
  namespace: gnimpieba-dts-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osworld-runner-vmi
  namespace: gnimpieba-dts-lab
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osworld-runner-vmi
  namespace: gnimpieba-dts-lab
subjects:
  - kind: ServiceAccount
    name: osworld-runner
    namespace: gnimpieba-dts-lab
roleRef:
  kind: Role
  name: osworld-runner-vmi
  apiGroup: rbac.authorization.k8s.io
